<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUTO DANA</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--text:#ffffff;--muted:#b5b5b5;--accent:#d90429;--accent-text:#ffffff;--border:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:32px 20px 40px}
.head{text-align:center;margin-bottom:24px}
.logo{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;margin:0 auto 16px;letter-spacing:1px}
h1{margin:0;font-size:28px;letter-spacing:1px}
.who{margin:8px 0 0;color:var(--muted);font-size:16px}
.who strong{color:var(--text)}
.tag{display:inline-block;margin:10px 0 0;padding:4px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.btn{border-left:4px solid var(--accent)}
.btn.primary{border-left-color:#fff}
.btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.ic{font-size:22px;width:28px;text-align:center}
.t{display:flex;flex-direction:column;min-width:0}
.t b{font-size:16px}
.t span{font-size:13px;opacity:.8;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="head">
<h1>AUTO DANA</h1>
<div class="tag">Showroom</div>
<p class="who"><strong>Abderrahim El Hnaoui</strong><br>Gérant</p>
</div>

<a class="btn primary" href="tel:+212672409290">
<span class="ic">📞</span>
<span class="t"><b>Appeler</b><span>06 72 40 92 90</span></span>
</a>

<a class="btn" href="https://wa.me/212672409290">
<span class="ic">💬</span>
<span class="t"><b>WhatsApp</b><span>Envoyer un message</span></span>
</a>

<a class="btn" href="https://www.google.com/maps/search/?api=1&query=Centre+d%27affaires+Kairaouane+Rte+Casablanca+40080">
<span class="ic">📍</span>
<span class="t"><b>Localisation</b><span>Près du rond-point Marjane, Centre d’affaires Kairaouane, RDC, Rte Casablanca, 40080</span></span>
</a>
</main>
</body>
</html>
